<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Task List</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>My Task List</h1>

        <!-- Add Task Form -->
        <form id="taskForm">

            <input
                type="text"
                id="taskInput"
                placeholder="Enter task name"
            >

            <button type="submit">
                Add
            </button>

        </form>


        <!-- Error message -->
        <p id="errorMessage"></p>


        <!-- Task list -->
        <ul id="taskList"></ul>

    </div>


    <script src="script.js"></script>

</body>

</html>
